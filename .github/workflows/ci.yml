name: Build, Test, and Deploy

on:
  push:
   # TODO - Remove initial memory map before PR 
    branches: [ "main", "initial-memory-map" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-app:
    name: Build Chip8 app
    runs-on: ubuntu-24.04

    env:
      BUILD_IMAGE_TAG: chip8-builder:${{ github.sha }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build the Container
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.BUILD_IMAGE_TAG }}
          file: .devcontainer/Dockerfile

      - name: Build Chip8 and Chip8Test
        id: build-app
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ env.BUILD_IMAGE_TAG }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            cmake -DCMAKE_BUILD_TYPE=Release -S . -B build
            cmake --build build --target all -j 12

      - name: Upload Chip8 Artifact
        uses: actions/upload-artifact@v7
        with:
         name: chip8-${{ github.sha }}
         path: build/Chip8/Chip8
      
      - name: Upload Chip8Test Artifact
        uses: actions/upload-artifact@v7
        with:
         name: chip8-test-${{ github.sha }}
         path: build/Chip8/Chip8Test

  test-app:
    name: Test Chip8 app
    runs-on: ubuntu-24.04
    needs: [ build-app ]
    steps:
      # This is needed to have a valid git repo for the test reporter
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: chip8-test-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Run tests
        run: |
         ${{ runner.temp }}/Chip8Test
